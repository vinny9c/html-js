<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Form</title>
</head>
<body>

    <form >
        <label for="username">USERNAME:</label><br>
        <input type="text" id="username" name="username"><br><br>

        <label for="email">EMAIL ID:</label><br>
        <input type="text" id="email" name="email"><br><br>

        <label>SELECT GENDER</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <label>SELECT SUBJECTS</label><br>
        <input type="checkbox" id="maths" name="subjects" value="maths">
        <label for="maths">Maths</label>
        <input type="checkbox" id="science" name="subjects" value="science">
        <label for="science">Science</label><br><br>

        <label for="description">Description:</label><br>
        <textarea id="description" name="description" rows="4" cols="40"></textarea><br><br>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
